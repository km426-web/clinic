<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>さくらクリニック - 診療科詳細</title>
<style>
body { font-family: Arial; margin:0; padding:0; background:#f5f7fa; }
header { background:#2c7a7b; color:white; text-align:center; padding:2rem 1rem; }
main { max-width:900px; margin:2rem auto; padding:0 1rem; }
section { background:white; padding:2rem; margin-bottom:2rem; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.1);}
h2 { color:#2c7a7b; margin-bottom:1rem; }
ul { margin-left:1.5rem; }
.btn { display:inline-block; padding:0.5rem 1rem; background:#2c7a7b; color:white; text-decoration:none; border-radius:4px; margin-top:0.5rem;}
.btn:hover { background:#285e61;}
@media(max-width:768px){ main { margin:1rem; } }
</style>
</head>
<body>

<header>
<h1>さくらクリニック</h1>
<p>診療科詳細ページ</p>
</header>

<main>
<section id="internal">
<h2>内科</h2>
<p>一般内科診療・健康診断・生活習慣病管理など</p>
<ul>
  <li>高血圧・糖尿病管理</li>
  <li>定期健康診断</li>
  <li>感染症の診療</li>
</ul>
<a href="appointment.html" class="btn">予約する</a>
</section>

<section id="cardiology">
<h2>循環器科</h2>
<p>心臓・血管に関する診療を専門に行います</p>
<ul>
  <li>心電図・超音波検査</li>
  <li>不整脈の診断</li>
  <li>心臓病管理</li>
</ul>
<a href="appointment.html" class="btn">予約する</a>
</section>

<section id="pediatrics">
<h2>小児科</h2>
<p>乳幼児から小学生までの診療・予防接種</p>
<ul>
  <li>予防接種スケジュール</li>
  <li>乳幼児健診</li>
  <li>風邪・感染症対応</li>
</ul>
<a href="appointment.html" class="btn">予約する</a>
</section>

<section id="dermatology">
<h2>皮膚科</h2>
<p>湿疹やアトピー、ニキビ治療など</p>
<ul>
  <li>アトピー性皮膚炎管理</li>
  <li>美容皮膚科（シミ・しわ治療）</li>
  <li>湿疹・かぶれ治療</li>
</ul>
<a href="appointment.html" class="btn">予約する</a>
</section>

</main>
</body>
</html>
