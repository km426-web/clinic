<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>さくらクリニック - 予約フォーム</title>
	<style>
			body {
				 font-family: Arial;
				 background:#f5f7fa;
				 margin:0;
				 padding:0; 
			 }
			header { 
				background: #FFDBED;
				color:#007e77;
				text-align:center;
				padding:2rem 1rem; 
			}
			main { 
				max-width:600px;
				margin:2rem auto;
				background:#FFF5F5;
				padding:2rem;
				border-radius:8px;
				box-shadow:0 2px 6px rgba(0,0,0,0.1);
			}
			label { 
				display:block;
				margin-top:1rem;
				margin-bottom:0.3rem;
			}
			input, select, textarea { 
				width:100%;
				padding:0.5rem;
				border-radius:4px;
				border:1px solid #ccc;
			}
			button {
				display: block;
				margin:0 auto;
				margin-top:1rem; 
				padding:0.6rem 0.8rem; 
				font-size:1.2rem;
				color:#007e77;
				box-shadow: 0 8px 8px  darkslategray;
				border: none; 
				border-radius:4px;
				cursor:pointer;
			 }
			button:hover { 
				background:#FFDBED;
				box-shadow: 0 8px 8px;
			}
			@media(max-width:768px){
				main { margin:1rem; }
			}
	</style>
</head>
<body>

<header>
<h1>さくらクリニック</h1>
<p>オンライン予約フォーム</p>
</header>

<main>
	<h2>診療予約</h2>
	<form action="#" method="post">
	  <label for="name">お名前</label>
	  <input type="text" id="name" name="name" required>
	
	  <label for="email">メールアドレス</label>
	  <input type="email" id="email" name="email" required>
	
	  <label for="phone">電話番号</label>
	  <input type="tel" id="phone" name="phone">
	
	  <label for="department">診療科</label>
	  <select id="department" name="department" required>
	    <option value="">選択してください</option>
	    <option value="internal">内科</option>
	    <option value="cardiology">循環器科</option>
	    <option value="pediatrics">小児科</option>
	    <option value="dermatology">皮膚科</option>
	  </select>
	
	  <label for="date">希望日</label>
	  <input type="date" id="date" name="date" required>
	
	  <label for="time">希望時間</label>
	  <input type="time" id="time" name="time" required>
	
	  <label for="notes">備考</label>
	  <textarea id="notes" name="notes" rows="4"></textarea>
	
	  <button type="submit">予約を送信</button>
	</form>
</main>

</body>
</html>
